<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script>
        $(document).ready(function (){
            // alert("Ok")
            display()
            $("#upbtn").hide()
        })

        
    const register = () => {
        const name = $('#name').val()
        const email = $('#email').val()
        const age = $('#age').val()

        let csrfmiddlewaretoken = $('input[name="csrfmiddlewaretoken"]').val();

        $.post('register',{csrfmiddlewaretoken,name,email,age},function(rt){
            $("#msg").html(rt)
            $("#name").val("")
            $("#email").val("")
            $("#age").val("")
            display()
        })
    }

    const display = () => {
        $.get('display',{},function(rt){
            var rows = ""
            rt.data.map(ele => {
                rows += `<tr>
                                <td>${ele.id}</td>
                                <td>${ele.name}</td>
                                <td>${ele.email}</td>
                                <td>${ele.age}</td>
                                <td>
                                    <button class="btn btn-warning btn-sm" onclick='retrive(${ele.id})'>Edit</button>
                                    <button class="btn btn-danger btn-sm" onclick='deletestudent(${ele.id})'>Delete</button>
                                </td>
                            </tr>`
            })
            $("#tdata").html(rows)
        })
    }

    const search = (q) => {
        $.get('search',{q},function(rt){
            var rows = ""
            rt.data.map(ele => {
                rows += `<tr>
                                <td>${ele.id}</td>
                                <td>${ele.name}</td>
                                <td>${ele.email}</td>
                                <td>${ele.age}</td>
                                <td>
                                    <button class="btn btn-warning btn-sm">Edit</button>
                                    <button class="btn btn-danger btn-sm">Delete</button>
                                </td>
                            </tr>`
            })
            $("#tdata").html(rows)
        })
    }

    const deletestudent = (id) => {
        r = confirm("Are you sure, want to delete?")
        if (r==true) {
            $.get('delete',{id},function(rt){
                display()
            })
        }
    }

    const retrive = (id) => {
        $.get('retrive',{id},function(rt){
            $("#id").val(rt.student[0].id)
            $("#name").val(rt.student[0].name)
            $("#email").val(rt.student[0].email)
            $("#age").val(rt.student[0].age)
            $("#upbtn").show()
            $("#smbtn").hide()
        })
    }
    
    const update = () => {
        const id = $('#id').val()
        const name = $('#name').val()
        const email = $('#email').val()
        const age = $('#age').val()

        let csrfmiddlewaretoken = $('input[name="csrfmiddlewaretoken"]').val();

        $.post('update',{csrfmiddlewaretoken,id,name,email,age},function(rt){
            $("#msg").html(rt)
            $("#name").val("")
            $("#email").val("")
            $("#age").val("")
            display()
            $("#smbtn").show()
            $("#upbtn").hide()
        })
    }

    </script>
</head>

<body class="bg-light">

    <div class="container mt-5">

        <!-- Student Registration Form -->
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">Student Registration</h3>
            </div>

            <div class="card-body">
                <span id="msg" class="text-success"></span>
                    {%csrf_token%}
                    <input type="hidden" id="id">
                    <div class="row">

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Student Name</label>
                            <input type="text" class="form-control" placeholder="Enter Name" id="name" name="name">
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" placeholder="Enter Email" id="email" name="email">
                        </div>

                        <div class="col-md-4 mb-3">
                            <label class="form-label">Age</label>
                            <input type="number" class="form-control" placeholder="Enter Age" id="age" name="age">
                        </div>

                    </div>

                    <button type="submit" class="btn btn-primary" id="smbtn" onclick="register()">
                        Register
                    </button>

                    <button type="update" class="btn btn-primary" id="upbtn" onclick="update()">
                        Update
                    </button>

            </div>
        </div>

        <!-- Student List -->
        <div class="card shadow mt-4">
            <div class="card-header bg-dark text-white">
                <h3 class="mb-0">Student List</h3>
            </div>

            <div class="card-body">
                <input type="text" class="form-control" placeholder="Search" onkeyup="search(value)">
                <br>
                <div class="table-responsive">

                    <table class="table table-bordered table-hover text-center align-middle">

                        <thead class="table-secondary">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Age</th>
                                <th width="180">Action</th>
                            </tr>
                        </thead>

                        <tbody id="tdata">

                            

                        </tbody>

                    </table>

                </div>
            </div>
        </div>

    </div>

</body>

</html>
