<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List Form</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(135deg,#4facfe,#00f2fe);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial, Helvetica, sans-serif;
        }

        .shopping-card{
            width:100%;
            max-width:550px;
            background:rgba(255,255,255,0.18);
            backdrop-filter:blur(12px);
            border-radius:20px;
            padding:35px;
            box-shadow:0 10px 30px rgba(0,0,0,.25);
            border:1px solid rgba(255,255,255,.3);
        }

        .shopping-card h2{
            font-weight:bold;
            color:#fff;
            text-align:center;
            margin-bottom:25px;
        }

        .form-label{
            color:#fff;
            font-weight:600;
        }

        .form-control,
        .form-select{
            border-radius:12px;
            padding:12px;
            border:none;
        }

        .form-control:focus,
        .form-select:focus{
            box-shadow:0 0 0 .2rem rgba(255,255,255,.4);
        }

        .btn-save{
            background:#fff;
            color:#007bff;
            font-weight:bold;
            border-radius:12px;
            padding:12px;
            transition:.3s;
        }

        .btn-save:hover{
            background:#007bff;
            color:#fff;
            transform:translateY(-2px);
        }
    </style>
</head>
<body>

<div class="shopping-card">

    <h2><i class="bi bi-cart4"></i> Shopping List</h2>

    <span class="text-success">{{msg}}</span>

    <form action="{%url 'create'%}" method="post" enctype="multipart/form-data">

        {%csrf_token%}

        <input type="hidden" name="id" value="{{product.id}}">

        <div class="mb-3">
            <label class="form-label">Product Name</label>
            <input
                type="text"
                class="form-control"
                name="name"
                placeholder="Enter product name"
                required
                value="{{product.name}}">
        </div>

        <div class="mb-3">
            <label class="form-label">Image</label>
            <input
                type="file"
                class="form-control" name="image">
        </div>

        <div class="mb-3">
            <label class="form-label">Price (₹)</label>
            <input
                type="number"
                class="form-control"
                name="price"
                placeholder="Enter price"
                step="0.01"
                required
                value="{{product.price}}">
        </div>

        <div class="mb-3">
            <label class="form-label">Quantity</label>
            <input
                type="number"
                class="form-control"
                name="qty"
                placeholder="Enter quantity"
                min="1"
                required
                value="{{product.qty}}">
        </div>

        <div class="mb-4">
            <label class="form-label">Category</label>
            <select class="form-select" name="cat" required>
                <option selected>Select Category</option>
                {%for cat in categories%}
                <option value="{{cat.id}}" {%if cat.id == product.category.id%}selected{%endif%}>{{cat.name}}</option>
                {%endfor%}
            </select>
        </div>

        <button type="submit" class="btn btn-save w-100">
            <i class="bi bi-plus-circle"></i> Add to Shopping List
        </button>
        <br><br>
        <a href="{%url 'display'%}" class="btn btn-save w-100">Display</a>

    </form>

</div>

</body>
</html>
