<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registration Records</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>

<body class="bg-light">

  <div class="container mt-5">

    <div class="card shadow">

      <div class="card-header bg-primary text-white">
        <h3 class="mb-0">Registration Records</h3>
      </div>

      <div class="card-body">

        <div class="table-responsive">
          <table class="table table-bordered table-hover table-striped align-middle">

            <thead class="table-dark">
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
                <th>Action</th>
              </tr>
            </thead>

            <tbody>
                {%for product in products%}
              <tr>
                <td>{{forloop.counter}}</td>
                <td>{{product.name}}</td>
                <td>₹{{product.price}}</td>
                <td>{{product.qty}}</td>
                <td>₹{{product.total}}</td>
                <td>
                  <a href="{%url 'delete'%}?id={{product.id}}" class="btn btn-sm btn-danger">Delete</a>
                  <a href="{%url 'update'%}?id={{product.id}}" class="btn btn-sm btn-warning">Update</a>
                </td>
                {%endfor%}
              </tr>

            </tbody>

          </table>
          <a href="{%url 'index'%}">Registration</a>
        </div>

      </div>
    </div>

  </div>

</body>
</html>
