<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const add = () => {
            const num1 = parseInt(document.getElementById("num1").value);
            const num2 = parseInt(document.getElementById("num2").value);
            const res = num1 + num2;
            document.getElementById('res').textContent = res;
        };

         const sub = () => {
            const num1 = parseInt(document.getElementById("num1").value);
            const num2 = parseInt(document.getElementById("num2").value);
            const res = num1 - num2;
            document.getElementById('res').textContent = res;
        };

         const mul = () => {
            const num1 = parseInt(document.getElementById("num1").value);
            const num2 = parseInt(document.getElementById("num2").value);
            const res = num1 * num2;
            document.getElementById('res').textContent = res;
        };

         const div = () => {
            const num1 = parseInt(document.getElementById("num1").value);
            const num2 = parseInt(document.getElementById("num2").value);
            const res = num1 / num2;
            document.getElementById('res').textContent = res;
        };
    </script>
</body>
    <input type="text" id="num1" placeholder="Enter number">
    <br>
    <input type="text" id="num2" placeholder="Enter number">
    <br>
    <input type="button" value="Add" onclick="add()">
    <input type="button" value="Sub" onclick="sub()">
    <input type="button" value="Mul" onclick="mul()">
    <input type="button" value="Div" onclick="div()">

    <p id="res"></p>

</html>
