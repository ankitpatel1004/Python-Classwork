<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <form action="" method="post">
        <fieldset>
            <legend>Ragistration Form</legend>

            <label for="uname">Username</label>
            <input type="text" name="uname" id="uname" placeholder="Enter Username">

            <br><br>

            <label for="email">Email</label>
            <input type="text" name="email" id="email">
            
            <br><br>

            <label for="pass">Password</label>
            <input type="text" name="pass" id="pass">

            <br><br>
            
            <label for="">Gender</label>
            <input type="radio" name="gender" id="gender" value="male" checked>Male
            <input type="radio" name="gender" id="gender" value="femle">Female
            
            <br><br>

            <label for="">Languages</label>
            <input type="checkbox" name="lang" value="guj">Gujarati
            <input type="checkbox" name="lang" value="hindi">Hindi
            <input type="checkbox" name="lang" value="eng">English

            <br><br>

            <label for="Country"></label>
            <select name="country" id="country">
                <option value="1">India</option>
                <option value="2">USA</option>
                <option value="3">Canada</option>
            </select>

            <br><br>

            <label for="Address"></label>
            <textarea rows="5" cols="25"></textarea>

            <br><br>

            <label for="">Date</label>
            <input type="date" name="date" id="date">

            <br><br>

            <label for="">Color</label>
            <input type="color" name="color" id="color">

            <br><br>

            <label for="">Age</label>
            <input type="number" name="age">

            <br><br>

            <input type="SUBMIT">
            <input type="RESET">

        </fieldset>
    </form>
</body>
</html>
