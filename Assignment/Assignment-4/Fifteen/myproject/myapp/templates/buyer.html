<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyer Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f8f9fa;
        }

        .hero{
            background:linear-gradient(135deg,#0d6efd,#4dabf7);
            color:white;
            padding:60px 0;
            border-radius:0 0 30px 30px;
        }

        .card{
            border:none;
            border-radius:15px;
            transition:.3s;
        }

        .card:hover{
            transform:translateY(-5px);
            box-shadow:0 10px 25px rgba(0,0,0,.15);
        }

        .icon{
            font-size:45px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">🛒 Buyer Dashboard</a>

        <a href="{%url 'logout'%}" class="btn btn-danger">
            Logout
        </a>
    </div>
</nav>

<section class="hero text-center">
    <div class="container">
        <h1>Welcome {{user.first_name}}</h1>
        <p>Browse products and manage your purchases.</p>
    </div>
</section>

<div class="container my-5">

    <div class="row g-4">

        <div class="col-md-4">
            <div class="card p-4 text-center">
                <div class="icon">🛍️</div>
                <h4 class="mt-3">Browse Products</h4>
                <p>Explore the latest available products.</p>
                <a href="#" class="btn btn-primary">View Products</a>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-4 text-center">
                <div class="icon">❤️</div>
                <h4 class="mt-3">Wishlist</h4>
                <p>View your saved favourite items.</p>
                <a href="#" class="btn btn-outline-primary">Open Wishlist</a>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-4 text-center">
                <div class="icon">📦</div>
                <h4 class="mt-3">Orders</h4>
                <p>Track and manage your recent orders.</p>
                <a href="#" class="btn btn-success">My Orders</a>
            </div>
        </div>

    </div>

</div>

</body>
</html>
