<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student List</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="text-center mb-0">Student List</h3>
        </div>

        <div class="card-body">

            <div class="table-responsive">
                <table class="table table-bordered table-hover table-striped align-middle text-center">
                    <thead class="table-dark">
                        <tr>
                            <th>Sr.No.</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Gender</th>
                            <th>Language</th>
                            <th>Country</th>
                            <th>Address</th>
                            <th colspan="2">Action</th>
                        </tr>
                    </thead>

                    <tbody>
                        
                        {%for i in students%}
                        <tr>
                            <td>{{forloop.counter}}</td>
                            <td>{{i.name}}</td>
                            <td>{{i.email}}</td>
                            <td>{{i.gender}}</td>
                            <td>
                                {%for k in i.lang%}
                                <span class="">{{k}}</span>
                                {%endfor%}
                            </td>
                            <td>{{i.country}}</td>
                            <td>{{i.address}}</td>
                            <td>
                                <a href="{%url 'delete'%}?id={{i.id}}" class="btn btn-danger">Delete</a>
                                <a href="{%url 'update'%}?id={{i.id}}" class="btn btn-success">Update</a>
                            </td>
                        </tr>
                        {%endfor%}
                    </tbody>

                </table>
                <a href="{%url 'index'%}" class="btn btn-primary">Add Student</a>
            </div>

        </div>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
