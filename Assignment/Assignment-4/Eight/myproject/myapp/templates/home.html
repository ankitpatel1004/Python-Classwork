<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:#f1f3f6;
        }

        /* Flipkart-like Navbar */
        .navbar{
            background-color:#2874f0;
        }

        .navbar-brand{
            color:#fff !important;
            font-size:26px;
            font-weight:bold;
        }

        .search-box{
            width:450px;
        }

        .welcome-card{
            max-width:600px;
            margin:70px auto;
            border:none;
            border-radius:10px;
            box-shadow:0 5px 15px rgba(0,0,0,0.15);
        }

        .logout-btn{
            text-decoration:none;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <!-- Logo -->
            <a class="navbar-brand" href="#">Flipkart</a>

            <!-- Search -->
            <form class="d-flex mx-auto search-box">
                <input class="form-control me-2"
                       type="search"
                       placeholder="Search for products, brands and more">
                <button class="btn btn-warning" type="submit">
                    Search
                </button>
            </form>

            <!-- Logout -->
            <div>
                <a href="{% url 'logout' %}" class="btn btn-light">
                    Logout
                </a>
            </div>

        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">

        <div class="card welcome-card">
            <div class="card-body text-center p-5">

                <h1 class="text-primary mb-3">
                    Home
                </h1>

                <h2 class="mb-4">
                    Welcome
                    <span class="text-success">{{ user }}</span>
                </h2>

                <a href="{% url 'logout' %}" class="btn btn-danger px-4">
                    Logout
                </a>

            </div>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
