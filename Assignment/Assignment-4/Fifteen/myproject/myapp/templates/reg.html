<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {

            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;

        }

        .form-card {

            background: #fff;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, .2);

        }

        .title {

            color: #764ba2;
            font-weight: 700;

        }

        .btn-custom {

            background: linear-gradient(90deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px;

        }

        .btn-custom:hover {

            color: white;
            opacity: .9;

        }

        .section-title {

            font-weight: 600;

        }
    </style>

</head>

<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="form-card">
                    <h2 class="text-center title mb-4">
                        Create Account
                    </h2>

                    <span class="text-success">{{success}}</span>
                    <form method="POST">
                        {%csrf_token%}

                        <!-- Role Dropdown -->

                        <div class="mb-4">

                            <label class="fw-bold mb-2">
                                Select Role
                            </label>
                            <select class="form-select" name="role" required>
                                <option value="" selected disabled>Choose Role</option>
                                {%for role in roles%}
                                <option value="{{role.id}}">{{role.name}}</option>
                                {%endfor%}
                            </select>

                        </div>

                        <!-- Personal Details -->

                        <h5 class="section-title text-primary mb-3">
                            Personal Details
                        </h5>

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <div class="form-floating">
                                    <input type="text" class="form-control" name="firstname" placeholder="First Name"
                                        required>
                                    <label>
                                        First Name
                                    </label>
                                </div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <div class="form-floating">
                                    <input type="text" class="form-control" name="lastname" placeholder="Last Name"
                                        required>
                                    <label>
                                        Last Name
                                    </label>
                                </div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <div class="form-floating">
                                    <input type="tel" class="form-control" name="phone" placeholder="Phone" required>
                                    <label>
                                        Phone Number
                                    </label>
                                </div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <div class="form-floating">
                                    <input type="number" class="form-control" name="age" placeholder="Age" min="1"
                                        required>
                                    <label>
                                        Age
                                    </label>
                                </div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <div class="form-floating">
                                    <input type="password" class="form-control" name="password" placeholder="Password"
                                        minlength="6" required>
                                    <label>
                                        Password
                                    </label>
                                </div>
                            </div>

                            <!-- Address -->

                            <div class="form-floating mb-4">
                                <textarea class="form-control" name="adr" placeholder="Address" style="height:100px"
                                    required></textarea>
                                <label>
                                    Address
                                </label>
                            </div>

                            <button type="submit" class="btn btn-custom w-100 mt-3">
                                Register
                            </button>

                            <div class="text-center mt-3">
                                Already have an account?
                                <a href="{%url 'index'%}" class="fw-bold text-decoration-none">
                                    Login
                                </a>
                            </div>

                    </form>
                </div>
            </div>

        </div>

    </div>

</body>

</html>
