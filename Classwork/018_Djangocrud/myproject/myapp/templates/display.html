<!DOCTYPE html>
<html>
<head>
    <title>User Table</title>
    <style>
        table {
            width: 60%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <table>
        <thead>
            <tr>
                <th>Sr.No.</th>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Age</th>
                <th colspan="2">Action</th>
            </tr>
        </thead>
        <tbody>
            {%for Student in students%}
            <tr>
                <td>{{forloop.counter}}</td>
                <td>{{Student.id}}</td>
                <td>{{Student.name}}</td>
                <td>{{Student.email}}</td>
                <td>{{Student.age}}</td>
                <td><a href="{%url 'delete'%}?id={{Student.id}}" class="btn btn-danger">Delete</a></td>
                <td><a href="{%url 'update'%}?id={{Student.id}}" class="btn btn-primary">Update</a></td>
            </tr>
            {%endfor%}
        </tbody>
    </table>
    <a href="{%url 'index'%}" class="btn btn-info">Add Student</a>

</body>
</html>
