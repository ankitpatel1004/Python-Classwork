{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block body %}

<style>

    /* ================= LOGIN PAGE ================= */

    .login-page {
        min-height: calc(100vh - 150px);
        padding: 100px 20px;
        background: #f8f9fa;
        display: flex;
        align-items: center;
        justify-content: center;
    }


    /* ================= LOGIN CARD ================= */

    .login-card {
        width: 100%;
        max-width: 450px;
        background: white;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.09);
    }


    /* ================= TITLE ================= */

    .login-title {
        text-align: center;
        margin-bottom: 30px;
    }

    .login-icon {
        width: 65px;
        height: 65px;
        margin: 0 auto 18px;
        background: #fff3cd;
        color: #d99b24;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
    }

    .login-title h1 {
        font-size: 30px;
        font-weight: 700;
        margin-bottom: 8px;
    }

    .login-title h1 span {
        color: #d99b24;
    }

    .login-title p {
        color: #777;
        font-size: 14px;
        margin: 0;
    }


    /* ================= FORM ================= */

    .form-group {
        margin-bottom: 20px;
    }

    .form-label {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .form-control {
        padding: 12px 14px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
    }

    .form-control:focus {
        border-color: #f4b942;
        box-shadow: 0 0 0 0.2rem rgba(244, 185, 66, 0.15);
    }


    /* ================= LOGIN BUTTON ================= */

    .btn-login {
        width: 100%;
        background: #f4b942;
        border: none;
        color: #111;
        padding: 12px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 15px;
        transition: 0.3s;
    }

    .btn-login:hover {
        background: #d99b24;
        color: white;
        transform: translateY(-2px);
    }


    /* ================= EXTRA LINKS ================= */

    .login-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 22px;
        font-size: 13px;
    }

    .login-options a {
        color: #d99b24;
        text-decoration: none;
        font-weight: 600;
    }

    .login-options a:hover {
        color: #b47d16;
    }


    .register-text {
        text-align: center;
        color: #777;
        font-size: 14px;
        margin-top: 25px;
        margin-bottom: 0;
    }

    .register-text a {
        color: #d99b24;
        text-decoration: none;
        font-weight: 600;
    }


    /* ================= RESPONSIVE ================= */

    @media (max-width: 576px) {

        .login-page {
            padding: 70px 15px;
        }

        .login-card {
            padding: 30px 22px;
        }

        .login-title h1 {
            font-size: 26px;
        }

    }

</style>


<!-- ================= LOGIN PAGE ================= -->

<section class="login-page">

    <div class="login-card">


        <!-- LOGIN TITLE -->

        <div class="login-title">

            <div class="login-icon">
                🔐
            </div>

            <h1>
                Welcome <span>Back</span>
            </h1>

            <p>
                Login to your account to manage your hotel bookings.
            </p>

        </div>


        <!-- ================= LOGIN FORM ================= -->
        <span>{{err}}</span>
        <form action="{%url 'login'%}" method="POST">

            {% csrf_token %}


            <!-- USERNAME -->

            <div class="form-group">

                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter your username"
                    required>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required>

            </div>


            <!-- OPTIONS -->

            <div class="login-options">

                <div>

                    <input
                        type="checkbox"
                        name="remember"
                        id="remember">

                    <label for="remember">
                        Remember me
                    </label>

                </div>

                <a href="#">
                    Forgot Password?
                </a>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="btn btn-login">

                Login

            </button>


        </form>


        <!-- REGISTER -->

        <p class="register-text">

            Don't have an account?

            <a href="{%url 'register'%}">
                Create Account
            </a>

        </p>


    </div>

</section>

{% endblock %}
