<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Playlist Manager</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    <style>
        body {
            background: linear-gradient(135deg, #1d70b9, #121212, #191414);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .playlist-card {
            margin-top: 50px;
            background: rgba(255, 255, 255, .08);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, .45);
        }

        h2 {
            color: #fff;
            font-weight: 700;
        }

        label {
            color: #fff;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-control {
            background: rgba(255, 255, 255, .15);
            color: #fff;
            border: none;
            border-radius: 10px;
        }

        .form-control::placeholder {
            color: #ddd;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, .2);
            color: #fff;
            border: 1px solid #1DB954;
            box-shadow: none;
        }

        .btn-add {
            background: #1DB954;
            color: #fff;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            padding: 10px 30px;
            transition: .3s;
        }

        .btn-add:hover {
            background: #18a44b;
            color: #fff;
            transform: translateY(-2px);
        }

        .table-container {
            margin-top: 35px;
            border-radius: 15px;
            overflow: hidden;
        }

        .table {
            margin-bottom: 0;
        }

        .table thead {
            background: #1DB954;
            color: #fff;
        }

        .table tbody tr {
            background: rgba(255, 255, 255, .08);
            color: #fff;
        }

        .table tbody tr:nth-child(even) {
            background: rgba(255, 255, 255, .12);
        }

        .table tbody tr:hover {
            background: rgba(29, 185, 84, .18);
        }

        .btn-edit {
            background: #ffc107;
            color: #000;
            border: none;
            font-weight: 600;
            border-radius: 8px;
        }

        .btn-edit:hover {
            background: #ffca2c;
            color: #000;
        }

        .btn-delete {
            background: #dc3545;
            color: #fff;
            border: none;
            font-weight: 600;
            border-radius: 8px;
        }

        .btn-delete:hover {
            background: #bb2d3b;
            color: #fff;
        }

        @media(max-width:768px) {
            .playlist-card {
                padding: 20px;
            }

            .table {
                font-size: 14px;
            }

            .btn {
                margin-bottom: 5px;
            }
        }
    </style>

    <script>
        $(document).ready(function () {
            // alert("ok")
            display()
            $('#upbtn').hide()
        })

        const register = () => {
            const title = $('#title').val()
            const artist = $('#artist').val()
            const duration = $('#duration').val()

            let csrfmiddlewaretoken = $('input[name="csrfmiddlewaretoken"]').val();

            $.post('register', { csrfmiddlewaretoken, title, artist, duration }, function (rt) {
                $('#msg').text(rt)
                $('#title').val("")
                $('#artist').val("")
                $('#duration').val("")
                display()
            })
        }

        const display = () => {
            $.get('display', {}, function (rt) {
                var rows = ""
                rt.data.map(ele => {
                    rows +=
                        `<tr>
                            <td>${ele.id}</td>
                            <td>${ele.title}</td>
                            <td>${ele.artist}</td>
                            <td>${ele.duration}</td>
                            <td>
                                <button class="btn btn-edit btn-sm me-2" onclick='retrive_data(${ele.id})'>
                                    <i class="bi bi-pencil-square"></i> Edit
                                </button>

                                <button class="btn btn-delete btn-sm" onclick='delete_song(${ele.id})'>
                                    <i class="bi bi-trash"></i> Delete
                                </button>
                            </td>
                        </tr>`
                })
                $('#tdata').html(rows)
            })
        }

        const delete_song = (id) => {
            r = confirm("Are you sure, want to delete song?")
            if (r === true) {
                $.get('delete', { id }, function (rt) {
                    display()
                })
            }
        }

        const retrive_data = (id) =>{
            $.get('retrive',{id},function(rt){
                $('#id').val(rt.play[0].id);
                $('#title').val(rt.play[0].title);
                $('#artist').val(rt.play[0].artist);
                $('#duration').val(rt.play[0].duration);
                
                $('#smbtn').hide()
                $('#upbtn').show()
            })
        }

        const update_data = () =>{
            const id = $('#id').val();
            const title = $('#title').val();
            const artist = $('#artist').val();
            const duration = $('#duration').val();

            let csrfmiddlewaretoken = $('input[name="csrfmiddlewaretoken"]').val();

            $.post('update', { csrfmiddlewaretoken, id, title, artist, duration }, function (rt) {
                $('#msg').html(rt)
                $('#id').val("")
                $('#title').val("")
                $('#artist').val("")
                $('#duration').val("")
                display()
                $('#smbtn').show()
                $('#upbtn').hide()
            })
        }

    </script>

</head>

<body>

    <div class="container">

        <div class="playlist-card">

            <h2 class="text-center mb-4">
                🎵 Spotify Music App
            </h2>

            <!-- Playlist Form -->
            <span id="msg" class="text-dark"></span>
            <form method="post">

                {%csrf_token%}

                <input type="hidden" name="id" id="id">

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label>Song Title</label>
                        <input type="text" class="form-control" name="title" id="title" placeholder="Enter song title">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Artist</label>
                        <input type="text" class="form-control" name="artist" id="artist"
                            placeholder="Enter artist name">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Duration</label>
                        <input type="text" class="form-control" name="duration" id="duration" placeholder="3:45">
                    </div>

                </div>

                <div class="text-center mt-3">
                    <button type="submit" class="btn btn-add" id="smbtn" onclick="register()">
                        <i class="bi bi-plus-circle"></i> Add Playlist
                    </button>

                     <button type="submit" class="btn btn-add" id="upbtn" onclick="update_data()">
                        <i class="bi bi-plus-circle"></i> Update
                    </button>
                </div>

            </form>

            <!-- Playlist Table -->

            <div class="table-responsive table-container">

                <table class="table table-hover align-middle text-center">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>🎵 Title</th>
                            <th>🎤 Artist</th>
                            <th>⏱ Duration</th>
                            <th>⚙ Actions</th>
                        </tr>
                    </thead>

                    <tbody id="tdata">


                    </tbody>

                </table>

            </div>

        </div>

    </div>

</body>

</html>
