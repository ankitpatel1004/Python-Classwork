<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="gpt.css">
    <link rel="icon" href="topslogo.ico">
    <title>Welcome to TOPS Management System</title>
</head>
<body>

    <div class="container">

        <header>
            <img src="logo-tops.png" alt="TOPS Logo">
            <h1>Student Registration & Accounting System</h1>
        </header>

        <div class="login-card">
            <h2>Login</h2>

            <form>
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" placeholder="Enter Username">
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter Password">
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn-login">Login</button>
                    <button type="reset" class="btn-reset">Reset</button>
                </div>
            </form>
        </div>

        <footer>
            Copyright © 2026 TOPS International
        </footer>

    </div>

</body>
</html>

        <button type="submit">Login</button>

    </div>
</div>
