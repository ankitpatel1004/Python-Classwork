<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h3>Student Registration Form</h3>
                </div>

                <div class="card-body">
                    <span class="text-success">{{message}}</span>
                    <form method="post" action="">
                        {%csrf_token%}
                        <!-- Name -->
                        <div class="mb-3">
                            <label class="form-label">Student Name</label>
                            <input type="text" class="form-control" name="name" placeholder="Enter your name" value="{{student.name}}">
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email" placeholder="Enter your email" value="{{student.email}}">
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" name="password" placeholder="Enter password" value="{{student.password}}">
                        </div>

                        <!-- Gender -->
                        <div class="mb-3">
                            <label class="form-label d-block">Gender</label>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="male" value="Male" {%if student.gender == 'Male'%}checked{%endif%}>
                                <label class="form-check-label" for="male">Male</label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="female" value="Female" {%if student.gender == 'Female'%}checked{%endif%}>
                                <label class="form-check-label" for="female">Female</label>
                            </div>

                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="other" value="Other" {%if student.gender == 'Other'%}checked{%endif%}>
                                <label class="form-check-label" for="other">Other</label>
                            </div>
                        </div>

                        <!-- Language -->
                        <div class="mb-3">
                            <label class="form-label d-block">Languages Known</label>

                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="lang" value="English" {%if 'English' in student.lang %}checked{%endif%}> 
                                <label class="form-check-label" for="english">English</label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="lang" value="Hindi" {%if 'Hindi' in student.lang %}checked{%endif%}>
                                <label class="form-check-label" for="hindi">Hindi</label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="lang" value="Gujarati" {%if 'Gujarati' in student.lang %}checked{%endif%}>
                                <label class="form-check-label" for="gujarati">Gujarati</label>
                            </div>
                        </div>

                        <!-- Country -->
                        <div class="mb-3">
                            <label class="form-label">Country</label>
                            <select class="form-select" name="country">
                                <option selected>Select Country</option>
                                <option {%if student.country == 'India'%}selected{%endif%}>India</option>
                                <option {%if student.country == 'USA'%}selected{%endif%}>USA</option>
                                <option {%if student.country == 'Canada'%}selected{%endif%}>Canada</option>
                                <option {%if student.country == 'Australia'%}selected{%endif%}>Australia</option>
                                <option {%if student.country == 'UK'%}selected{%endif%}>UK</option>
                            </select>
                        </div>

                        <!-- Address -->
                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <textarea class="form-control" rows="4" name="address" placeholder="Enter your address" value="{{student.address}}"></textarea>
                        </div>

                        <!-- Buttons -->
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <button type="submit" class="btn btn-primary">Register</button>
                            <button type="reset" class="btn btn-primary me-md-2">Reset</button>
                            <a href="{%url 'display'%}" class="btn btn-primary">Display</a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
